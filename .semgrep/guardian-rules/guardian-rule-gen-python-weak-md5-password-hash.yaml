rules:
- id: guardian-rule-gen.python-weak-md5-password-hash
  languages:
  - python
  severity: WARNING
  message: Flags hashlib md5() used to hash passwords. MD5 is fast and broken for
    credential storage; use Django's make_password or a dedicated KDF such as bcrypt
    or argon2.
  metadata:
    category: security
    cwe: 'CWE-328: Use of Weak Hash'
  patterns:
  - pattern-either:
    - pattern: md5($X, ...)
    - pattern: hashlib.md5($X, ...)
  - metavariable-regex:
      metavariable: $X
      regex: (?i).*(passw|pwd).*
