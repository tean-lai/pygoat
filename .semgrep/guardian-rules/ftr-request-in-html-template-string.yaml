rules:
  - id: ftr-request-in-html-template-string
    mode: taint
    languages: [python]
    severity: WARNING
    message: Request data is concatenated into an HTML or template string. That bypasses autoescaping (XSS) and, if the string is later compiled as a template, allows template injection.
    metadata:
      source: findings-to-rules
      cwe: "CWE-79: Cross-site Scripting"
    pattern-sources:
      - patterns:
          - pattern: request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(GET|POST|body|FILES|COOKIES|META|data|form|args|values|cookies|headers|files|json)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '"$S" + $X'
              - pattern: '$X + "$S"'
              - pattern: '$Y + $X + "$S"'
              - pattern: '"$S" % $X'
              - pattern: '"$S".format(..., $X, ...)'
          - metavariable-regex:
              metavariable: $S
              regex: (<[a-zA-Z/!]|\{%|\{\{)
          - focus-metavariable: $X
